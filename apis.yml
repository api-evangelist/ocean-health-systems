apis:
- name: CKM REST API
  description: >-
    REST API for the Clinical Knowledge Manager — 48 operations across 39 paths covering archetypes
    (list, search, ADL/XML/mindmap retrieval, specialisation parent, status by asset version, MD5
    hash, import, trunk update, delete), templates (list, search, OET/OPT retrieval, file-set URL,
    required archetypes, embedded templates, validation report, status read and update, import,
    trunk update, delete), the archetype/template union "resources" view with the instance publisher
    namespace, projects and subdomains, change requests and resource proposals, and user and session
    management. Authentication is HTTP Basic or a JSESSIONID session header; public projects on a
    public instance read anonymously.
  humanURL: https://ckm.openehr.org/ckm/rest-doc/
  baseURL: https://ckm.openehr.org/ckm/rest/v1
  x-base-url-note: >-
    The published Swagger 2.0 contract declares basePath /ckm/rest/v1 and NO host, because CKM is
    licensed software deployed per organisation — the host is whichever CKM instance the caller has
    access to. The baseURL recorded here is the public reference deployment, openEHR
    International's instance of Ocean's CKM. The identical contract is served at
    https://arketyper.no/ckm/rest/v1, which confirms the contract belongs to Ocean's software rather
    than to any single host.
  x-ownership: >-
    Ownership verified 2026-09-02 against the spec's own self-description, not its fetch URL:
    info.title "CKM REST API", info.contact.name "CKM Support", info.contact.email
    ckm@oceaninformatics.com, and info.contact.url the Ocean service desk at
    https://oceanehr.atlassian.net/servicedesk/customer/portal/15. oceaninformatics.com and
    oceanehr.com both 301 to oceanhealthsystems.com, so the contact domains are Ocean's own.
