  note: >-
    Deliberate absences, each measured on 2026-09-02. Recording them here so a later round does not
    re-litigate them, and so no pointer asserts a surface Ocean does not serve.
  omitted:
  - type: WellKnown
    reason: 'every named /.well-known/ path returns 404 on all three hosts; control probe also 404 (see well-known/)'
  - type: SecurityTxt
    reason: '/.well-known/security.txt 404 on oceanhealthsystems.com, www., and ckm.openehr.org'
  - type: MCPServer
    reason: 'no first-party MCP server exists; mcp/ holds a DERIVED candidate with deployment.mode none'
  - type: AgentCard
    reason: '/.well-known/agent-card.json and /.well-known/agent.json 404 on every host; nothing written to a2a/'
  - type: SDKs
    reason: 'no first-party client library in npm, PyPI, Maven Central or NuGet (see packages/)'
  - type: Idempotency
    reason: 'no idempotency key; only conditional requests (if-match / if-unmodified-since, 412)'
  - type: StatusPage
    reason: 'no status page; oceanhealthsystems.statuspage.io is Statuspage''s catch-all, confirmed against a control probe'
  - type: Deprecation
    reason: 'no deprecation or sunset policy, and zero operations marked deprecated in the contract'
  - type: Security
    reason: 'no vulnerability disclosure policy, security.txt or bug bounty found'
  - type: Compliance
    reason: 'no certifications or audit attestations published; no trust centre'
  - type: Pricing
    reason: 'no pricing page anywhere in the site sitemap; every product routes to a demo form'
  - type: SignUp
    reason: 'no self-serve sign-up; enterprise sales gate only'
  - type: Postman
    reason: 'Postman public search returned zero collections or workspaces for CKM/openEHR'
  - type: AsyncAPI
    reason: 'no event, streaming or webhook surface in the contract or the docs'
  - type: Webhooks
    reason: 'no webhook catalogue published'
  - type: Protobuf
    reason: 'no .proto published'
  - type: WSDL
    reason: '?wsdl probes returned the HTML app shell or 410 Gone; no SOAP contract served'
  - type: OAuthScopes
    reason: 'no oauth2 or openIdConnect scheme in the contract, so there is no scope surface'
