aid: ocean-health-systems
name: Ocean Health Systems
description: >-
  Ocean Health Systems (legally Ocean Informatics Pty Ltd, founded 1998, with offices in Bundall QLD,
  Chatswood NSW and London) is the Australian clinical-informatics company whose founders
  commercialised the first openEHR clinical data repository and built Clinical Knowledge Manager
  (CKM) — the repository and collaborative governance environment in which openEHR archetypes,
  templates, terminology subsets and release sets are authored, peer reviewed, semantically
  versioned, approved and published, with terminology binding to SNOMED CT and LOINC and mappings
  out to FHIR and OMOP. CKM runs the international openEHR community instance as well as national
  and vendor deployments, and ships a documented Swagger 2.0 REST API (48 operations) for
  discovering models and pulling their ADL, XML, OET and Operational Template representations.
  Ocean also builds Multiprac Immunize and Multiprac Surveillance for immunisation and infection
  prevention, and publishes the free Archetype Editor and Template Designer authoring tools.
