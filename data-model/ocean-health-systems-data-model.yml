entities:
  - name: CkmResource
    description: >-
      The governed artefact — the union type over archetypes, templates, term sets and release sets.
      Carries the governance state that CKM exists to manage: status, asset version, SemVer revision
      (current / latest / latest-published), creation and modification times, owning project, and
      branch name when it is not on the trunk.
    key: cid
