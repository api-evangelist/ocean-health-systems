notes:
  - >-
    The model is deliberately governance-shaped rather than clinical-data-shaped. CKM holds the
    MODELS (archetypes, templates, term sets, release sets) and their review lifecycle; it holds no
    patient record. Clinical data lives in an openEHR CDR that consumes the OPT this API serves.
  - >-
    Publisher namespace is an instance-level property, readable at GET /resources/publisher-namespace
    — useful for confirming which organisation's CKM deployment you are talking to.
