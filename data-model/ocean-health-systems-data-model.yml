  - name: Archetype
    description: >-
      A CkmResource with resourceType ARCHETYPE. Not a separate schema — the API projects it through
      CkmResource and serves its content in ADL, XML and mindmap representations.
    key: cid
    representations: [adl, xml, mindmap]
  - name: Template
    description: >-
      A CkmResource with resourceType TEMPLATE, served as OET (authoring form) and OPT (operational
      template — the artefact a CDR consumes). Templates compose archetypes and may embed other
      templates.
    key: cid
    representations: [oet, opt, file-set-url]
  - name: Project
    description: >-
      The ownership and permission boundary for resources. Typed PROJECT or INCUBATOR, flagged
      public/private, may be marked forOrderTemplates, and belongs to a subdomain.
    key: cid
    fields_of_note: [cid, name, projectURL, cidSubdomain, subdomainName, public, projectType, remoteSubdomain, forOrderTemplates]
  - name: Subdomain
    description: The top-level partition of a CKM instance; groups projects.
    key: cid
  - name: ChangeRequest
    description: A governance request raised against a resource and tracked to resolution.
    key: cid
  - name: ResourceProposal
    description: A proposal for a new or changed resource, awaiting triage into a project.
    key: cid
  - name: User
    description: >-
      A CKM account. NewUser is the write-side shape (POST /users); User is the read-side shape
      returned by GET /sessions. Usernames are constrained to firstname.lastname.
    key: username
  - name: TemplateValidationItem
    description: >-
