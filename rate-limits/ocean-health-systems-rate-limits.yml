note: >-
  No rate limits are published and none are declared in the contract. The 48-operation spec declares
  status codes 200, 201, 204, 400, 401, 403, 404, 412 and 424 — there is no 429 anywhere, and no
  X-RateLimit-*, RateLimit-* or Retry-After header appears in any response definition. The openEHR
  Confluence page that the community treats as the CKM API landing page is a two-line pointer at the
  Swagger UI and says nothing about limits or fair use. An agent calling this API therefore has no
  runtime backpressure signal at all and must self-throttle.
related:
  - >-
    The only usage-governance document Ocean publishes is a general Acceptable Use Policy
    (https://oceanhealthsystems.com/fair-use-policy/, 200) covering its software and services. It
    sets behavioural expectations, not numeric API quotas.
